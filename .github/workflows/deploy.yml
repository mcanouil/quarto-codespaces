name: "Deploy: Documentation"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  pages:
    name: Documentation website
    uses: mcanouil/quarto-workflows/.github/workflows/pages.yml@v2
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      use-main-as-release: true
      # Publish the default branch whatever the trigger: a release runs
      # against its tag, which predates the quarto check transcripts that
      # land on the default branch afterwards. Pull requests keep the
      # checkout action's default so the gate renders the proposed change.
      ref: ${{ github.event_name != 'pull_request' && github.event.repository.default_branch || '' }}
