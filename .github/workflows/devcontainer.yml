name: "Build: Docker Images"

on:
  workflow_dispatch:
  release:
    types: [ published ]
  schedule:
    - cron: "0 6 * * sun"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check-feature-sync:
    runs-on: ubuntu-latest
    name: Check - Duplicated features in sync
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify duplicated dev container features are identical
        run: |
          diff -r .github/.devcontainer/uv .devcontainer/universal/uv
          diff -r .github/.devcontainer/quarto-computing-dependencies .devcontainer/universal/quarto-computing-dependencies

  build:
    runs-on: ${{ matrix.RUNNER }}
    name: Build - Quarto ${{ matrix.QUARTO_VERSION }} (${{ matrix.ARCH }})
    needs:
      - "check-feature-sync"
    if: >-
      ! endsWith(github.event.pull_request.user.login, '[bot]') &&
        (
          github.event_name == 'release' ||
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'schedule' ||
            github.event_name == 'pull_request'
        )
    strategy:
      fail-fast: false
      matrix:
        include:
          - QUARTO_VERSION: release
            ARCH: amd64
            RUNNER: ubuntu-latest
          - QUARTO_VERSION: release
            ARCH: arm64
            RUNNER: ubuntu-24.04-arm
          - QUARTO_VERSION: prerelease
            ARCH: amd64
            RUNNER: ubuntu-latest
          - QUARTO_VERSION: prerelease
            ARCH: arm64
            RUNNER: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: true

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Image Version
        id: image_version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> ${GITHUB_OUTPUT}
          else
            echo "VERSION=$(git rev-parse --short HEAD)" >> ${GITHUB_OUTPUT}
          fi

      - name: Build and run Dev Container on release
        id: devcontainer-ci
        uses: devcontainers/ci@v0.3
        with:
          imageTag: ${{ matrix.QUARTO_VERSION }}-${{ matrix.ARCH }}
          subFolder: .github
          imageName: ghcr.io/${{ github.repository }}
          noCache: ${{ github.event_name != 'pull_request' }}
          cacheFrom: ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}:{1}-{2}',
            github.repository, matrix.QUARTO_VERSION, matrix.ARCH) || '' }}
          eventFilterForPush: |
            release
            workflow_dispatch
            schedule
          platform: linux/${{ matrix.ARCH }}
          runCmd: echo "$(CI=true quarto check 2>&1)" | sed '/^(/d;
            s/\x1b\[[0-9;]*[mGK]//g'
        env:
          IMAGE: "buildpack-deps:noble-curl"
          QUARTO_VERSION: ${{ matrix.QUARTO_VERSION }}
          USER: "vscode"
          ANNOTATION_VERSION: "${{ steps.image_version.outputs.VERSION }} (${{ github.sha }})"
          ANNOTATION_TITLE: "Quarto Codespaces"
          ANNOTATION_DESCRIPTION: "Quarto Codespaces / Dev Containers setup for quick
            online testing and workshops."
          ANNOTATION_AUTHORS: "Mickaël CANOUIL <https://mickael.canouil.fr>"
          ANNOTATION_URL: ${{ github.server_url }}/${{ github.repository }}
          ANNOTATION_LICENSE: "MIT"

      - name: Test Dev Container
        env:
          QUARTO_VERSION: ${{ matrix.QUARTO_VERSION }}
          ARCH: ${{ matrix.ARCH }}
          DEVCONTAINER_RUN_CMD: ${{ steps.devcontainer-ci.outputs.runCmdOutput }}
        run: |
          echo "::group::Quarto Check"
          echo "${DEVCONTAINER_RUN_CMD}"
          echo "::endgroup::"

          (
            echo "## Quarto Check Results: ${QUARTO_VERSION} (${ARCH})"
            echo "<details><summary>Quarto Check Results</summary>"
            echo ""
            echo '```txt'
            echo "${DEVCONTAINER_RUN_CMD}"
            echo '```'
            echo ""
            echo "</details>"
          ) >>${GITHUB_STEP_SUMMARY}

      - name: Save quarto check output
        env:
          QUARTO_VERSION: ${{ matrix.QUARTO_VERSION }}
          DEVCONTAINER_RUN_CMD: ${{ steps.devcontainer-ci.outputs.runCmdOutput }}
        run: |
          mkdir -p /tmp/quarto-check-outputs
          echo "${DEVCONTAINER_RUN_CMD}" > "/tmp/quarto-check-outputs/${QUARTO_VERSION}.txt"

      - name: Upload quarto check output
        uses: actions/upload-artifact@v7
        with:
          name: quarto-check-${{ matrix.QUARTO_VERSION }}-${{ matrix.ARCH }}
          path: /tmp/quarto-check-outputs/${{ matrix.QUARTO_VERSION }}.txt
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    name: Merge - Quarto ${{ matrix.QUARTO_VERSION }} manifests

    needs:
      - "build"

    if: >-
      github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'

    strategy:
      matrix:
        include:
          - QUARTO_VERSION: release
            IMAGE_TAG_BASE: release,release-noble,latest
          - QUARTO_VERSION: prerelease
            IMAGE_TAG_BASE: prerelease,prerelease-noble

    steps:
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: true

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine per-architecture images into multi-architecture tags
        env:
          BASE_TAGS: ${{ matrix.IMAGE_TAG_BASE }}
          QUARTO_VERSION: ${{ matrix.QUARTO_VERSION }}
        run: |
          BUILD_ID=$(date -u +%Y%m%d%H%M)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"

          echo "::group::Manifest tags for ${QUARTO_VERSION}"
          echo "Build ID: ${BUILD_ID}"
          echo "Base tags: ${BASE_TAGS}"

          # Every base tag also gets a build metadata variant, except 'latest'
          IFS=',' read -ra TAG_ARRAY <<< "${BASE_TAGS}"
          TAG_ARGS=()
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_ARGS+=(--tag "${IMAGE}:${tag}")
            if [[ "${tag}" != "latest" ]]; then
              TAG_ARGS+=(--tag "${IMAGE}:${tag}-${BUILD_ID}")
            fi
          done
          echo "All tags: ${TAG_ARGS[*]}"
          echo "::endgroup::"

          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "${IMAGE}:${QUARTO_VERSION}-amd64" \
            "${IMAGE}:${QUARTO_VERSION}-arm64"

          docker buildx imagetools inspect "${IMAGE}:${QUARTO_VERSION}"

  update-docs:
    runs-on: ubuntu-latest

    needs:
      - "build"

    if: >-
      github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'

    permissions:
      contents: write

    env:
      TARGET_FILE: docs/reference/quarto-check.qmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Update branch
        run: |
          git fetch --all
          git checkout main
          git pull origin main

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Git Config
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Download quarto check outputs
        uses: actions/download-artifact@v8
        with:
          path: /tmp/quarto-check-outputs

      - name: Update documentation with quarto check outputs
        env:
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          update_docs_section() {
            local version=$1
            local output_file=$2
            local build_url=$3

            # An empty transcript would be committed as an empty code block, so
            # fail loudly when the artifact is missing rather than silently
            # publishing a blank section.
            if [ ! -s "${output_file}" ]; then
              echo "::error::Missing or empty quarto check output: ${output_file}"
              return 1
            fi

            # Normalise version for marker tags
            local version_upper
            version_upper=$(echo "${version}" | tr '[:lower:]' '[:upper:]')

            # Define markers
            local output_start="<!-- QUARTO_CHECK_${version_upper}_START -->"
            local output_end="<!-- QUARTO_CHECK_${version_upper}_END -->"
            local url_start="<!-- QUARTO_CHECK_${version_upper}_BUILD_URL_START -->"
            local url_end="<!-- QUARTO_CHECK_${version_upper}_BUILD_URL_END -->"

            # Create temporary file
            local temp_file
            temp_file=$(mktemp)

            # Update quarto check output section. The transcript is read from
            # the file inside awk rather than passed with -v, because a
            # multi-line -v value is not portable across awk variants. The
            # blank lines around the injected block are required: without them
            # Pandoc reads the code fence as part of the HTML comment block.
            awk -v start="${output_start}" \
                -v end="${output_end}" \
                -v outfile="${output_file}" '
              BEGIN { in_block=0 }
              index($0, start) {
                print $0
                print ""
                print "```txt"
                # quarto check redraws its progress spinner with carriage
                # returns; Pandoc reads those as line breaks and loses track
                # of the enclosing div, so strip them.
                while ((getline line < outfile) > 0) { gsub(/\r/, "", line); print line }
                close(outfile)
                print "```"
                print ""
                in_block=1
                next
              }
              index($0, end) {
                print $0
                in_block=0
                next
              }
              !in_block { print }
            ' "${TARGET_FILE}" > "${temp_file}"

            # Update build URL section
            awk -v start="${url_start}" \
                -v end="${url_end}" \
                -v url="${build_url}" '
              BEGIN { in_block=0 }
              index($0, start) {
                print $0
                print ""
                print "[View build log](" url ")"
                print ""
                in_block=1
                next
              }
              index($0, end) {
                print $0
                in_block=0
                next
              }
              !in_block { print }
            ' "${temp_file}" > "${TARGET_FILE}"

            rm -f "${temp_file}"

            echo "Updated ${version} section in ${TARGET_FILE}"
          }

          # Update both release and prerelease sections from the amd64 builds
          update_docs_section "release" "/tmp/quarto-check-outputs/quarto-check-release-amd64/release.txt" "${BUILD_URL}"
          update_docs_section "prerelease" "/tmp/quarto-check-outputs/quarto-check-prerelease-amd64/prerelease.txt" "${BUILD_URL}"

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: "ci/update-quarto-check-docs"
          COMMIT: "ci: update quarto check outputs in documentation"
        run: |
          if git show-ref --quiet refs/heads/${BRANCH}; then
            echo "Branch ${BRANCH} already exists."
            git branch -D "${BRANCH}"
            git push origin --delete "${BRANCH}"
          fi

          git checkout -b "${BRANCH}"

          git add "${TARGET_FILE}" || echo "No changes to add"
          git commit -m "${COMMIT}" || echo "No changes to commit"
          git push --force origin ${BRANCH} || echo "No changes to push"

          sleep 5
          gh pr create --fill-first --base "main" --head "${BRANCH}" --label "Type: CI/CD :robot:"
          sleep 2
          gh pr merge --auto --squash --delete-branch

  build-versions:
    runs-on: ubuntu-latest

    name: Build - Quarto ${{ matrix.QUARTO_VERSION }}

    needs:
      - "merge"
      - "update-docs"

    if: >-
      (github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule') &&
      always() && needs.merge.result == 'success' && needs.update-docs.result
      == 'success'

    strategy:
      matrix:
        PLATFORM:
          - "linux/amd64"
        QUARTO_VERSION:
          - "1.0"
          - "1.1"
          - "1.2"
          - "1.3"
          - "1.4"
          - "1.5"
          - "1.6"
          - "1.7"
          - "1.8"
          - "1.9"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Image Tags with Build Metadata
        id: image_tags
        env:
          QUARTO_VERSION: ${{ matrix.QUARTO_VERSION }}
        run: |
          BUILD_ID=$(date -u +%Y%m%d%H%M)
          echo "::group::Build Metadata Tags for Quarto ${QUARTO_VERSION}"
          echo "Build ID: ${BUILD_ID}"

          # Create base tags and build metadata tags
          BASE_TAGS="${QUARTO_VERSION},${QUARTO_VERSION}-noble"
          TAGS_WITH_BUILD="${QUARTO_VERSION}-${BUILD_ID},${QUARTO_VERSION}-noble-${BUILD_ID}"
          echo "Base tags: ${BASE_TAGS}"
          echo "Build metadata tags: ${TAGS_WITH_BUILD}"

          # Combine original tags with build metadata tags
          ALL_TAGS="${BASE_TAGS},${TAGS_WITH_BUILD}"
          echo "All tags: ${ALL_TAGS}"
          echo "::endgroup::"
          echo "IMAGE_TAG=${ALL_TAGS}" >> ${GITHUB_OUTPUT}

      - name: Build and run Dev Container on release
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}
          imageTag: ${{ steps.image_tags.outputs.IMAGE_TAG }}
          noCache: true
          push: always
          platform: ${{ matrix.PLATFORM }}
          configFile: ${{ format('.devcontainer/quarto-{0}/devcontainer.json',
            matrix.QUARTO_VERSION) }}

  clean:
    runs-on: ubuntu-latest
    needs:
      - "build-versions"
    if: >-
      github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - name: Delete obsolete/untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: "container"
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-only-untagged-versions: "true"
